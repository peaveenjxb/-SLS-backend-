spring.application.name=backend
server.port=${PORT:8081}

# Local fallback is H2 so the app can boot without environment variables.
# Override these with DB_* / JWT_SECRET variables when you want MySQL or a production secret.
spring.datasource.url=${DB_URL:jdbc:h2:mem:jwtauthdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT configuration
# 256-bit+ secret, base64 encoded. Replace with a securely generated secret in production.
app.jwt.secret=${JWT_SECRET:dGVzdC1qd3Qtc2VjcmV0LWZvci1sb2NhbC1kZXZlbG9wbWVudC0zMi1ieXRlcy0xMjM0NQ==}
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=86400000

# Frontend origin allowed for CORS
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
